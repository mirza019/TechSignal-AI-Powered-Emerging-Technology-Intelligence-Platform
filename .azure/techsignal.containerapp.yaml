name: techsignal
type: Microsoft.App/containerApps
properties:
  environmentId: /subscriptions/27aeb779-fd2c-4ffb-8fb5-9ae6a481e490/resourceGroups/lets-meet-rg/providers/Microsoft.App/managedEnvironments/procureai-consumption-env
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      allowInsecure: false
      targetPort: 8080
      transport: auto
      traffic:
        - latestRevision: true
          weight: 100
  template:
    containers:
      - name: frontend
        image: ghcr.io/mirza019/techsignal-frontend:0f0003d339f14d2e03488c7f444448792fdd9fb1
        env:
          - name: BACKEND_HOST
            value: 127.0.0.1:8000
          - name: NGINX_ENVSUBST_FILTER
            value: BACKEND_HOST
        resources:
          cpu: 0.25
          memory: 0.5Gi
      - name: backend
        image: ghcr.io/mirza019/techsignal-backend:0f0003d339f14d2e03488c7f444448792fdd9fb1
        env:
          - name: DATABASE_URL
            value: sqlite:////tmp/techsignal.db
          - name: SQLITE_BACKUP_PATH
            value: /backup/techsignal.db
          - name: APP_SECRET
            secretRef: app-secret
          - name: GEMINI_API_KEY
            secretRef: gemini-api-key
          - name: GEMINI_MODEL
            value: gemini-2.5-flash
          - name: ENVIRONMENT
            value: production
          - name: DEMO_MODE
            value: "false"
          - name: SEED_DEMO
            value: "false"
          - name: PUBLIC_DEMO
            value: "false"
          - name: BOOTSTRAP_LIVE_CATALOG
            value: "true"
          - name: ENABLE_GDELT
            value: "true"
          - name: ENABLE_SCHEDULER
            value: "true"
          - name: CORS_ORIGINS
            value: '["https://techsignal.icywater-653510cb.polandcentral.azurecontainerapps.io","https://mirza019.github.io"]'
          - name: FRONTEND_URL
            value: https://mirza019.github.io/TechSignal-AI-Powered-Emerging-Technology-Intelligence-Platform/
          - name: ENTRA_REDIRECT_URI
            value: https://techsignal.icywater-653510cb.polandcentral.azurecontainerapps.io/api/auth/sso/callback
          - name: ENTRA_TENANT_ID
            value: b2efcef3-8496-40b8-9de8-f135982f3461
          - name: ENTRA_CLIENT_ID
            value: a4d38bac-3162-46cb-b3f2-0d72a3560b72
          - name: ENTRA_CLIENT_SECRET
            secretRef: entra-client-secret
        volumeMounts:
          - volumeName: techsignal-data
            mountPath: /backup
        resources:
          cpu: 0.5
          memory: 1Gi
    scale:
      minReplicas: 1
      maxReplicas: 1
    volumes:
      - name: techsignal-data
        storageType: AzureFile
        storageName: techsignal-data
