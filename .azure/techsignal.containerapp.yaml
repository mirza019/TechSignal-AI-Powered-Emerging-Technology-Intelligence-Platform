name: techsignal
type: Microsoft.App/containerApps
properties:
  environmentId: /subscriptions/27aeb779-fd2c-4ffb-8fb5-9ae6a481e490/resourceGroups/lets-meet-rg/providers/Microsoft.App/managedEnvironments/procureai-consumption-env
  configuration:
    activeRevisionsMode: Single
    ingress:
      external: true
      allowInsecure: false
      targetPort: 8080
      transport: auto
      traffic:
        - latestRevision: true
          weight: 100
  template:
    containers:
      - name: frontend
        image: ghcr.io/mirza019/techsignal-frontend:141455f07f400db4fc34fed1d47bb7ee2af3ad8c
        env:
          - name: BACKEND_HOST
            value: 127.0.0.1:8000
          - name: NGINX_ENVSUBST_FILTER
            value: BACKEND_HOST
        resources:
          cpu: 0.25
          memory: 0.5Gi
      - name: backend
        image: ghcr.io/mirza019/techsignal-backend:141455f07f400db4fc34fed1d47bb7ee2af3ad8c
        env:
          - name: DATABASE_URL
            value: sqlite:////tmp/techsignal.db
          - name: APP_SECRET
            secretRef: app-secret
          - name: GEMINI_API_KEY
            secretRef: gemini-api-key
          - name: GEMINI_MODEL
            value: gemini-2.5-flash
          - name: ENVIRONMENT
            value: portfolio
          - name: DEMO_MODE
            value: "true"
          - name: SEED_DEMO
            value: "true"
          - name: PUBLIC_DEMO
            value: "true"
          - name: DEMO_ADMIN_PASSWORD
            secretRef: demo-admin-password
          - name: DEMO_ANALYST_PASSWORD
            secretRef: demo-analyst-password
          - name: DEMO_VIEWER_PASSWORD
            secretRef: demo-viewer-password
          - name: ENABLE_GDELT
            value: "true"
          - name: ENABLE_SCHEDULER
            value: "false"
          - name: CORS_ORIGINS
            value: '["https://techsignal.icywater-653510cb.polandcentral.azurecontainerapps.io"]'
          - name: FRONTEND_URL
            value: https://techsignal.icywater-653510cb.polandcentral.azurecontainerapps.io
          - name: ENTRA_REDIRECT_URI
            value: https://techsignal.icywater-653510cb.polandcentral.azurecontainerapps.io/api/auth/sso/callback
        resources:
          cpu: 0.5
          memory: 1Gi
    scale:
      minReplicas: 1
      maxReplicas: 1
    volumes: []
