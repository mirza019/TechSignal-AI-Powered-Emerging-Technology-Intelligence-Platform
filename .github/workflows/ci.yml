name: Validate TechSignal
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: ruff check app && python -m compileall -q app && pytest -q
        working-directory: backend
      - run: alembic upgrade head && python -m app.cli seed && alembic check
        working-directory: backend
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: radar
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://radar:radar@localhost:5432/radar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: alembic upgrade head && python -m app.cli seed && python -m app.cli generate-embeddings
        working-directory: backend
      - run: python scripts/postgres_smoke.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, postgres]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - run: docker compose up -d --wait
      - run: curl --fail http://localhost:8000/health/ready && curl --fail http://localhost:8080/
      - if: always()
        run: docker compose logs && docker compose down -v
