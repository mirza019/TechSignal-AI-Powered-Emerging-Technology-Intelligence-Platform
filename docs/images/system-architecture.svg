<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Grid Radar system architecture</title><desc id="desc">Evidence sources flow through a trust pipeline and intelligence core to analyst products.</desc>
  <defs><style>.bg{fill:#f6f8f4}.c{fill:#fff;stroke:#cfdbd2;stroke-width:2}.g{fill:#eaf4ed;stroke:#75a486;stroke-width:2}.p{fill:#f2eef8;stroke:#9a82ba;stroke-width:2}.h{font:700 16px Arial;fill:#234c40}.t{font:13px Arial;fill:#536b61}.k{font:700 11px Arial;fill:#688076;letter-spacing:1px}.a{stroke:#7d998b;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7d998b"/></marker></defs>
  <rect class="bg" width="1200" height="600" rx="24"/><text x="50" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#173f35">Grid Technology Intelligence Radar</text><text class="t" x="50" y="82">Evidence-first architecture with human approval at the decision boundary</text>
  <text class="k" x="50" y="125">PUBLIC INPUTS</text><text class="k" x="330" y="125">TRUST PIPELINE</text><text class="k" x="650" y="125">INTELLIGENCE CORE</text><text class="k" x="950" y="125">ANALYST PRODUCTS</text>
  <g transform="translate(50 150)"><rect class="c" width="210" height="85" rx="12"/><text class="h" x="22" y="34">Research + markets</text><text class="t" x="22" y="59">OpenAlex · GDELT</text></g><g transform="translate(50 260)"><rect class="c" width="210" height="85" rx="12"/><text class="h" x="22" y="34">Approved web pages</text><text class="t" x="22" y="59">Robots · allowlist · IP pin</text></g><g transform="translate(50 370)"><rect class="c" width="210" height="85" rx="12"/><text class="h" x="22" y="34">Analyst inputs</text><text class="t" x="22" y="59">Notes · reviews · sources</text></g>
  <g transform="translate(330 150)"><rect class="g" width="240" height="85" rx="12"/><text class="h" x="22" y="34">Collect + stage</text><text class="t" x="22" y="59">Pacing · retry · diagnostics</text></g><g transform="translate(330 260)"><rect class="g" width="240" height="85" rx="12"/><text class="h" x="22" y="34">Quality gate</text><text class="t" x="22" y="59">Validate · clean · deduplicate</text></g><g transform="translate(330 370)"><rect class="g" width="240" height="85" rx="12"/><text class="h" x="22" y="34">Atomic merge</text><text class="t" x="22" y="59">Entity links · rollback · audit</text></g>
  <g transform="translate(650 150)"><rect class="c" width="230" height="85" rx="12"/><text class="h" x="22" y="34">PostgreSQL + vectors</text><text class="t" x="22" y="59">Normalized evidence graph</text></g><g transform="translate(650 260)"><rect class="c" width="230" height="85" rx="12"/><text class="h" x="22" y="34">Scores + signals</text><text class="t" x="22" y="59">Stored inputs and formulas</text></g><g transform="translate(650 370)"><rect class="p" width="230" height="105" rx="12"/><text class="h" x="22" y="32">Grounded Gemini</text><text class="t" x="22" y="57">Bounded retrieval · schema</text><text class="t" x="22" y="78">Citation + number validation</text><text class="t" x="22" y="97">Deterministic fallback</text></g>
  <g transform="translate(950 150)"><rect class="c" width="200" height="85" rx="12"/><text class="h" x="22" y="34">Radar + profiles</text><text class="t" x="22" y="59">H1–H4 · organizations</text></g><g transform="translate(950 260)"><rect class="c" width="200" height="85" rx="12"/><text class="h" x="22" y="34">Briefings</text><text class="t" x="22" y="59">PDF · Markdown · questions</text></g><g transform="translate(950 370)"><rect class="g" width="200" height="85" rx="12"/><text class="h" x="22" y="34">Analyst approval</text><text class="t" x="22" y="59">Human-reviewed placement</text></g>
  <path class="a" d="M260 192H330M260 302H330M260 412H330M450 235V260M450 345V370M570 412H610V192H650M765 235V260M765 345V370M880 192H950M880 302H950M880 422H950"/>
  <rect x="330" y="520" width="820" height="46" rx="10" fill="#173f35"/><text x="355" y="549" font-family="Arial" font-size="14" fill="#fff">FastAPI + RBAC + audit</text><text x="570" y="549" font-family="Arial" font-size="14" fill="#dcebe2">React workspace</text><text x="750" y="549" font-family="Arial" font-size="14" fill="#dcebe2">Scheduled + manual runs</text><text x="985" y="549" font-family="Arial" font-size="14" fill="#dcebe2">Health + CI</text>
