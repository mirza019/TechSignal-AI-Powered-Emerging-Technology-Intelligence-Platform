<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Technology intelligence workflow</title><desc id="desc">Observable collection, quality, grounding and analyst review stages.</desc>
  <defs><style>.bg{fill:#f6f8f4}.b{fill:#fff;stroke:#d1ddd4;stroke-width:2}.g{fill:#e8f3eb;stroke:#6b9e7b;stroke-width:2}.p{fill:#f1edf7;stroke:#967db6;stroke-width:2}.n{font:700 12px Arial;fill:#fff}.h{font:700 15px Arial;fill:#244b40}.t{font:12px Arial;fill:#61756c}.a{stroke:#799487;stroke-width:2.5;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#799487"/></marker></defs>
  <rect class="bg" width="1200" height="430" rx="24"/><text x="45" y="55" font-family="Arial" font-size="28" font-weight="700" fill="#173f35">Evidence-to-decision workflow</text><text class="t" x="45" y="81">Failed merges roll back; diagnostics remain available for a linked retry.</text>
  <g transform="translate(45 120)"><rect class="b" width="190" height="82" rx="12"/><circle cx="24" cy="24" r="14" fill="#527e6b"/><text class="n" x="20" y="29">1</text><text class="h" x="48" y="29">Collect</text><text class="t" x="18" y="57">Paced, bounded providers</text></g><g transform="translate(275 120)"><rect class="b" width="190" height="82" rx="12"/><circle cx="24" cy="24" r="14" fill="#527e6b"/><text class="n" x="20" y="29">2</text><text class="h" x="48" y="29">Stage</text><text class="t" x="18" y="57">Persist diagnostics</text></g><g transform="translate(505 120)"><rect class="b" width="190" height="82" rx="12"/><circle cx="24" cy="24" r="14" fill="#527e6b"/><text class="n" x="20" y="29">3</text><text class="h" x="48" y="29">Quality gate</text><text class="t" x="18" y="57">Validate · normalize</text></g><g transform="translate(735 120)"><rect class="g" width="190" height="82" rx="12"/><circle cx="24" cy="24" r="14" fill="#527e6b"/><text class="n" x="20" y="29">4</text><text class="h" x="48" y="29">Atomic merge</text><text class="t" x="18" y="57">Commit or roll back</text></g><g transform="translate(965 120)"><rect class="b" width="190" height="82" rx="12"/><circle cx="24" cy="24" r="14" fill="#527e6b"/><text class="n" x="20" y="29">5</text><text class="h" x="48" y="29">Prepare</text><text class="t" x="18" y="57">Vectors + signals</text></g>
  <path class="a" d="M235 161H275M465 161H505M695 161H735M925 161H965M1060 202V245H830V270"/>
  <g transform="translate(735 270)"><rect class="b" width="190" height="82" rx="12"/><circle cx="24" cy="24" r="14" fill="#527e6b"/><text class="n" x="20" y="29">6</text><text class="h" x="48" y="29">Retrieve</text><text class="t" x="18" y="57">Bounded evidence bundle</text></g><g transform="translate(505 270)"><rect class="b" width="190" height="82" rx="12"/><circle cx="24" cy="24" r="14" fill="#527e6b"/><text class="n" x="20" y="29">7</text><text class="h" x="48" y="29">Synthesize</text><text class="t" x="18" y="57">Gemini or safe fallback</text></g><g transform="translate(275 270)"><rect class="g" width="190" height="82" rx="12"/><circle cx="24" cy="24" r="14" fill="#527e6b"/><text class="n" x="20" y="29">8</text><text class="h" x="48" y="29">Ground</text><text class="t" x="18" y="57">Citations + numbers</text></g><g transform="translate(45 270)"><rect class="p" width="190" height="82" rx="12"/><circle cx="24" cy="24" r="14" fill="#80639f"/><text class="n" x="20" y="29">9</text><text class="h" x="48" y="29">Analyst review</text><text class="t" x="18" y="57">Approve radar placement</text></g><path class="a" d="M735 311H695M505 311H465M275 311H235"/>
  <rect x="965" y="270" width="190" height="82" rx="12" fill="#173f35"/><text x="988" y="300" font-family="Arial" font-size="15" font-weight="700" fill="#fff">10  Reuse</text><text x="988" y="329" font-family="Arial" font-size="12" fill="#dcebe2">Radar · profiles · reports</text><path class="a" d="M235 347H965"/>
</svg>
